<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory Management System</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px; 
            background-color: #0f172a; 
            color: #e2e8f0; 
        }
        .login-container { 
            max-width: 400px; 
            margin: 0 auto; 
            background-color: #1e293b; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            border: 1px solid #334155; 
        }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; }
        
        input[type="text"], input[type="password"], select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #475569; 
            border-radius: 4px; 
            box-sizing: border-box; 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        
        input::placeholder { color: #64748b; }
        
        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }
        
        .btn { 
            background-color: #2563eb; 
            color: white; 
            padding: 12px 15px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn:hover { background-color: #1d4ed8; }
        
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 4px; font-size: 14px; }
        .alert-danger { background-color: #7f1d1d; color: #fecaca; border: 1px solid #991b1b; }
        .alert-success { background-color: #14532d; color: #bbf7d0; border: 1px solid #166534; }
        .alert-warning { background-color: #78350f; color: #fde68a; border: 1px solid #92400e; }
        
        .text-center { text-align: center; }
        
        /* Updated Header Styles */
        h2 { color: #f8fafc; margin-top: 0; margin-bottom: 5px; font-size: 22px; }
        h4 { color: #94a3b8; margin-top: 0; margin-bottom: 25px; font-weight: normal; font-size: 16px; }
        
        a { color: #60a5fa; transition: color 0.2s; }
        a:hover { color: #93c5fd; }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- New Titles -->
        <h2 class="text-center">Inventory Management System</h2>
        <h4 class="text-center">System Login</h4>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label>Store / Mart Name</label>
                <input type="text" name="shop_name" required placeholder="e.g. Rahul Supermarket">
            </div>
            
            <div class="form-group">
                <label>Role</label>
                <select name="user_role" id="user_role" onchange="toggleFields()">
                    <option value="Store / Mart Admin">Store / Mart Admin</option>
                    <option value="Department Staff">Department Staff</option>
                </select>
            </div>

            <div class="form-group" id="dept_group" style="display: none;">
                <label>Department</label>
                <select name="department">
                    {% for dept in departments %}
                    <option value="{{ dept }}">{{ dept }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group" id="passcode_group">
                <label>Admin Passcode</label>
                <input type="password" name="admin_passcode" placeholder="Enter security passcode">
            </div>
            
            <button type="submit" class="btn">Log In</button>
        </form>
        
        <div class="text-center" style="margin-top: 25px; font-size: 14px;">
            <p style="color: #94a3b8;">New here? <a href="/register" style="text-decoration: none; font-weight: bold;">Register your store</a></p>
        </div>
    </div>

    <script>
        function toggleFields() {
            var role = document.getElementById('user_role').value;
            var deptGroup = document.getElementById('dept_group');
            var passGroup = document.getElementById('passcode_group');
            
            if (role === 'Store / Mart Admin') {
                deptGroup.style.display = 'none';
                passGroup.style.display = 'block';
            } else {
                deptGroup.style.display = 'block';
                passGroup.style.display = 'none';
            }
        }
        
        window.onload = toggleFields;
    </script>
</body>
</html>
